services:
  db:
    container_name: postgres_container
    image: postgres:15.17
    ports:
    - 5000:5432
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
    - ./postgres/data:/var/lib/postgresql/data
    - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
      - my-network

  af:
    container_name: airflow_container
    build: .
    ports:
      - 8000:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./request_api:/opt/airflow/request_api
      - ./sql:/opt/airflow/sql
    depends_on:
      - db
    networks:
      - my-network
    command: > 
      bash -c "airflow db migrate && airflow standalone"
  

networks:
  my-network:
    driver: bridge
