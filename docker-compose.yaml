x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  # - ./superset:/app/superset
  - ./docker/superset_config.py:/app/pythonpath/superset_config.py

services:
  db:
    container_name: postgres_container
    image: postgres:15.17
    ports:
    - 5000:5432
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
    - ./postgres/data:/var/lib/postgresql/data
    - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
    networks:
      - my-network

  af:
    container_name: airflow_container
    build: .
    ports:
      - 8000:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
      TZ: UTC
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./request_api:/opt/airflow/request_api
      - ./sql:/opt/airflow/sql
    depends_on:
      - db
    networks:
      - my-network
    command: > 
      bash -c "ntpdate pool.ntp.org || true && airflow db migrate && airflow standalone"

  superset-init:
    image: apache/superset:3.0.0-py310
    container_name: superset-init
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: *superset-user
    volumes: *superset-volumes
    environment:
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_LOG_LEVEL: "{SUPERSET_LOG_LEVEL:-info}"
      DATABASE_DB: "superset_db"
    healthcheck:
      disable: true
    networks:
      - my-network

  superset:
    env_file:
      - path: docker/.env # default
        required: true
    image: apache/superset:3.0.0-py310
    container_name: superset_container
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    ports:
      - 8088:8088
    user: *superset-user
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
      DATABASE_DB: "superset_db"
    networks:
      - my-network
    
  redis:
    image: redis:7
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  redis:
    external: false